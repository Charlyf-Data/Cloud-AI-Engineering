# Durcissement commun : système de fichiers en lecture seule, aucune capacité Linux, pas d'élévation de privilèges
x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  env_file:
    - path: .env
      required: false

services:
  # Job ponctuel : génère les données (dev) puis entraîne et écrit le modèle dans le volume.
  train:
    <<: *hardening
    build:
      context: .
      args:
        REQUIREMENTS: requirements-train.txt
    image: express-delivery-train:${MODEL_VERSION:-1.1.0}
    entrypoint: ["sh", "-c"]
    command: ["python -m express_delivery.main generate && python -m express_delivery.main train"]
    volumes:
      - data:/app/data
      - artifacts:/app/artifacts
    mem_limit: 2g
    healthcheck:
      disable: true
    restart: "no"

  # Service API : charge le modèle depuis le volume (lecture seule).
  api:
    <<: *hardening
    build: .
    image: express-delivery-api:${MODEL_VERSION:-1.1.0}
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    volumes:
      - artifacts:/app/artifacts:ro
    mem_limit: 1g
    pids_limit: 128
    depends_on:
      train:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  data:
  artifacts:
