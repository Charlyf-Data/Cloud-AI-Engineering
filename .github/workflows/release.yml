name: Release - image Docker

# À la publication d'une release GitHub (tag vX.Y.Z), construit et publie les images
# sur GitHub Container Registry : ghcr.io/<owner>/<repo> (API) et ghcr.io/<owner>/<repo>-train.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: Vérifications
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publication ${{ matrix.variant }}
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: api
            requirements: requirements.txt
            suffix: ""
          - variant: train
            requirements: requirements-train.txt
            suffix: "-train"
    steps:
      - uses: actions/checkout@v5

      # ghcr.io exige un nom d'image en minuscules
      - name: Nom de l'image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}${{ matrix.suffix }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags et labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build et publication
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: REQUIREMENTS=${{ matrix.requirements }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
